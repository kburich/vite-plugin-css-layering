name: Dependency monitor

on:
  schedule:
    - cron: "17 6 * * *"    # daily 06:17 UTC (off-the-hour to dodge cron congestion)
  workflow_dispatch: {}      # manual runs for testing / on-demand checks
  push:
    branches: [main]         # the monitor runs on the default branch only
    paths:                   # re-scan immediately when the lockfile changes
      - "pnpm-lock.yaml"

jobs:
  monitor:
    uses: kburich/dependency-monitor/.github/workflows/monitor.yml@v4
    permissions:
      contents: write        # push the baseline to its orphan branch (dependency-baseline/<id>)
      issues: write          # open/update the rolling notification issues
    secrets:
      rl-token: ${{ secrets.RL_TOKEN }}
