name: Dependency monitor

on:
  schedule:
    - cron: "17 6 * * *"    # daily 06:17 UTC (off-the-hour to dodge cron congestion)
  workflow_dispatch: {}      # manual runs for testing / on-demand checks
  push:
    paths:                   # re-scan immediately when the lockfile changes;
      - "package-lock.json"  # trim this list to the lockfile(s) you actually have
      - "pnpm-lock.yaml"

jobs:
  monitor:
    uses: kburich/rl-protect-monitor/.github/workflows/monitor.yml@v1
    permissions:
      contents: write        # push the baseline to the rl-protect-baseline branch
      issues: write          # open/update the rolling notification issues
    with:
      baseline-branch: rl-protect-baseline   # keeps protected main untouched
    secrets:
      rl-token: ${{ secrets.RL_TOKEN }}
